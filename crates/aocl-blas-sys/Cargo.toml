[package]
name = "aocl-blas-sys"
description = "Unsafe FFI bindings to AOCL-BLAS (BLIS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"
links = "amd-blis"
categories = ["external-ffi-bindings", "science", "mathematics"]
keywords = ["aocl", "amd", "blas", "blis", "ffi"]

[features]
default = []
ilp64 = []
static-link = []
# Default OFF. 83 declarations the headers state but NO installed AOCL 6.0.68 Windows library exports, dynamic or static (a link
# error when used; Linux unmeasured). Enabling the feature only declares them; it does not make them link on Windows.
header-only-unexported = []
# Default OFF. Links the libflame DLL (Windows names measured) so `xerbla_array_`, which libflame exports and BLIS does not, links.
libflame = []
# Default OFF. Links `scalapack.dll` so the 13 `AOCL_FAL_*` / `AOCL_FLIST_*` / `AOCL_get*` helpers, which that DLL also exports, link in a
# dynamic build (Windows names measured). Needs the ScaLAPACK DLL and its MPI runtime on PATH. No effect with `static-link`.
scalapack-fal = []

[dependencies]

[build-dependencies]
aocl-build = { version = "0.3", path = "../aocl-build" }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]
