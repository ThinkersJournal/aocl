[package]
name = "aocl-math-sys"
description = "Unsafe FFI bindings to AOCL-LibM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"
links = "amd-libm"
categories = ["external-ffi-bindings", "science", "mathematics"]
keywords = ["aocl", "amd", "libm", "math", "ffi"]

[features]
default = []
static-link = []
# NIGHTLY ONLY: declares the 156 by-value SIMD functions (needs rustc `feature(simd_ffi)`). Never default; do not enable on stable or docs.rs.
simd_ffi = []

[build-dependencies]
aocl-build = { version = "0.2", path = "../aocl-build" }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]
