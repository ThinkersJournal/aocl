[package]
name = "aocl-scalapack"
description = "Safe Rust wrappers for AOCL-ScaLAPACK (Fortran/MPI; under construction)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["api-bindings", "mathematics", "science"]
keywords = ["aocl", "amd", "scalapack", "mpi", "blacs"]

[dependencies]
aocl-scalapack-sys = { version = "0.4", path = "../aocl-scalapack-sys" }
aocl-error = { version = "0.4", path = "../aocl-error" }
aocl-types = { version = "0.4", path = "../aocl-types" }

[features]
default = []
ilp64 = ["aocl-scalapack-sys/ilp64"]
static-link = ["aocl-scalapack-sys/static-link"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]

# Runs under `mpiexec`: a custom main so BLACS/MPI is initialised once per process, not once per test thread.
[[test]]
name = "pdgesv_mpi"
harness = false

[[test]]
name = "psgesv_mpi"
harness = false

[[test]]
name = "complex_mpi"
harness = false

[[test]]
name = "grid2d_mpi"
harness = false

[[test]]
name = "guard_lengths"
harness = false
