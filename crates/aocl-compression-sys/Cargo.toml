[package]
name = "aocl-compression-sys"
description = "Unsafe FFI bindings to AOCL-Compression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"
links = "amd-compression"
categories = ["external-ffi-bindings", "compression"]
keywords = ["aocl", "amd", "compression", "lz4", "zstd"]

[features]
default = []
static-link = []
# Default OFF. Declarations the headers state but NO installed AOCL 6.0.68 Windows library exports (a link error when used; Linux
# unmeasured). Enabling the feature only declares them; it does not make them link on Windows.
header-only-unexported = []

[dependencies]

[build-dependencies]
aocl-build = { version = "0.3", path = "../aocl-build" }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]
