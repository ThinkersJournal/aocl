[package]
name = "aocl-lapack-sys"
description = "Unsafe FFI bindings to AOCL-LAPACK (libFLAME)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"
links = "amd-libflame"
categories = ["external-ffi-bindings", "science", "mathematics"]
keywords = ["aocl", "amd", "lapack", "libflame", "ffi"]

[features]
default = []
ilp64 = []
static-link = []
# Default OFF. 150 declarations the headers state but NO installed AOCL 6.0.68 Windows library exports (a link error when used;
# Linux unmeasured): `LAPACKE_*x`/`xx` extended-precision routines and Fortran `*x_`/`clagge_`-type routines. Enabling the feature
# only declares them; it does not make them link on Windows.
header-only-unexported = []
# Default OFF. Links the BLIS library (Windows names measured) so `lsame_`, which BLIS exports and libflame does not, links.
blis = []

[dependencies]
libc.workspace = true

[build-dependencies]
aocl-build = { version = "0.2", path = "../aocl-build" }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]
